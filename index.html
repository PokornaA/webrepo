<!DOCTYPE html>
<html lang="cz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" description="pocasi" author="Pokorná">
    
    <title>pocasi</title>
    <link rel="icon" type="image/jpg" href="source/icons8-weather-forecast-48.png">
    <style>
        #youtubeOdkaz { display: none; }
    </style>
</head>
<body style="margin: 0; padding: 0; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center;">
    <header>
        <img src="source/new.jpg" width="100%" height="100%" alt="new york" style="border: none;">
        <div style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;">
            <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                <h1 style="color: rgb(1, 1, 1); font-size: 15rem; margin: 0; font-family: Arial, Helvetica, sans-serif;">The weather</h1>
                <h2 style="color: rgb(1, 1, 1); font-size: 10rem; margin: 0; font-family: Arial, Helvetica, sans-serif;">New York</h2>
                <h2 style="color: rgb(1, 1, 1); font-size: 5rem; margin: 0; font-family: Arial, Helvetica, sans-serif;"><span id="teplota">Načítám...</span></h2>
                <h2 style="color: rgb(1, 1, 1); font-size: 5rem; margin: 0; font-family: Arial, Helvetica, sans-serif;"><span id="srazky">Načítám...</span></h2>
            </div>
        </div>
        <div style="position: absolute; bottom: 20px; right: 20px;">
            
            <button type="button" onclick="window.location.href='https://www.youtube.com/'" style="padding: 10px 20px; font-size: 1.5rem; background-color: rgba(255, 255, 255, 0.8); border: none; border-radius: 5px; cursor: pointer;">Weekly weather forecat </button>
        </div>
    </header>

    <script>
        function otevriYoutube(event) {
            event.preventDefault();

            const odkaz = document.getElementById("youtubeOdkaz").value;
            const url = new URL(odkaz);
            const host = url.hostname.toLowerCase();

            if (url.protocol !== "https:" || !(host === "youtube.com" || host.endsWith(".youtube.com") || host === "youtu.be")) {
                alert("Vlož platný odkaz na YouTube.");
                return;
            }

            window.location.href = url.href;
        }

        async function nactiPocasi() {
            try {
                const url =
                    "https://api.open-meteo.com/v1/forecast?latitude=40.7143&longitude=-74.006&current=temperature_2m,rain&hourly=temperature_2m,rain&models=ncep_gfs_seamless&forecast_days=7";
                const odpoved = await fetch(url);

                if (!odpoved.ok) {
                    throw new Error("Nepodařilo se načíst data o počasí.");
                }

                const data = await odpoved.json();
                const teplota = data.current?.temperature_2m;
                const srazky = data.current?.rain;

                if (teplota === undefined || teplota === null || srazky === undefined || srazky === null) {
                    throw new Error("Data o počasí nebyla vrácena.");
                }

                document.getElementById("teplota").textContent = `${Math.round(teplota)}°C`;
                document.getElementById("srazky").textContent = `Srážky: ${srazky} mm`;
            } catch (error) {
                document.getElementById("teplota").textContent = "Chyba";
                document.getElementById("srazky").textContent = "Chyba";
                console.error(error);
            }
        }




        // id google sheet 12YRIAP2O5qisg3wKdPk4wh4KqGzZYK4vjRzYiW6Vvf4
        nactiPocasi();
    </script>
</body>
</html>
